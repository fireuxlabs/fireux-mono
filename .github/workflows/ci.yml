name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify IDE configuration
        run: pnpm ide:check

      - name: Offline unit tests
        run: pnpm test:unit

      - name: TypeScript project build check
        run: pnpm typecheck:packages

      - name: ESLint
        run: pnpm lint

      - name: Build packages
        run: pnpm build:packages

      - name: Build baseline Nuxt app
        run: pnpm build:nuxt-baseline

      - name: Summary
        run: |
          echo 'CI completed.'
