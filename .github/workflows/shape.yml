name: Shape
# Concurrent edit — 2026-07-20 20:46 CEST — Repo Efficiency Pass 3 of 6: use canonical guard and script-lifecycle commands directly.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm audit:scripts
        if: ${{ always() }}
