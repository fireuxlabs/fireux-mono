name: Shape
on:
  pull_request:
  push:
    branches: [main]
jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - run: pnpm guard:shape
      - run: pnpm guard:ts

