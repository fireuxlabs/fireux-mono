packages:
  - 'packages/core/*'
  - 'packages/extensions/*'
  - 'packages/ecosystem/*'
  - 'projects/*/*'
  - 'tools/*'

autoInstallPeers: false
confirmModulesPurge: false
engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true
verifyDepsBeforeRun: false
nodeVersion: 22.23.1

# Narrow install-script allowlist for dependencies required by the current toolchain.
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true
  vue-demi: true

overrides:
  nuxt: 4.5.2
  '@nuxt/kit': 4.5.2
  '@nuxt/schema': 4.5.2
  # 3.4.2 was published without its matching devtools-kit package.
  '@nuxt/devtools': 3.3.1
  # Newer cssnano 8 patches currently request unpublished PostCSS packages.
  cssnano: 8.0.4
  cssnano-preset-default: 8.0.4
  '@nuxt/content': 3.6.3
  c12: 3.3.4
  h3: 1.15.11
  vue: 3.5.40
  vue-router: 5.2.0
  firebase: 11.10.0
  vuefire: 3.2.2
  nuxt-vuefire: ^1.1.0
