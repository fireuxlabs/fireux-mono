packages:
  - 'packages/core/*'
  - 'packages/extensions/*'
  - 'packages/ecosystem/*'
  - 'packages/ecosystem/*/apps/*'
  - 'projects/*/*'
  - 'tools/*'
  - 'test-*'

autoInstallPeers: false
confirmModulesPurge: false
engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true
verifyDepsBeforeRun: false
nodeVersion: 22.23.1

allowBuilds:
  '@firebase/util': set this to true or false
  '@parcel/watcher': set this to true or false
  '@tailwindcss/oxide': set this to true or false
  better-sqlite3: true
  esbuild: set this to true or false
  protobufjs: set this to true or false
  unrs-resolver: set this to true or false
  vue-demi: set this to true or false

patchedDependencies:
  'httpxy@0.5.2': scripts/patches/httpxy@0.5.2.patch

overrides:
  nuxt: 4.4.6
  '@nuxt/kit': 4.4.6
  '@nuxt/schema': 4.4.6
  '@nuxt/content': 3.6.3
  c12: 3.3.4
  h3: 1.15.11
  vue: 3.5.20
  firebase: 11.10.0
  vuefire: 3.2.2
  nuxt-vuefire: ^1.1.0
