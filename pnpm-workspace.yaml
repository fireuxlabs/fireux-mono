packages:
  - 'packages/core/*'
  - 'packages/extensions/*'
  - 'packages/ecosystem/*'
  - 'projects/*/*'
  - 'tools/*'

autoInstallPeers: false
confirmModulesPurge: false
engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true
verifyDepsBeforeRun: false
nodeVersion: 22.23.1

# Narrow install-script allowlist for dependencies required by the current toolchain.
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true
  vue-demi: true

overrides:
  nuxt: 4.6.1
  '@nuxt/kit': 4.6.1
  '@nuxt/schema': 4.6.1
  '@nuxt/ui': 4.12.0
  '@internationalized/date': 3.12.4
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@tailwindcss/postcss': 4.3.3
  # motion-v 2.8 requests unpublished motion-dom 14.3; 2.6 satisfies Nuxt UI.
  motion-v: 2.6.0
  # Keep DevTools on a stable release with a published matching devtools-kit.
  '@nuxt/devtools': 3.4.4
  postcss: 8.5.31
  vite-plugin-pwa: 1.3.0
  '@nuxt/content': 3.6.3
  c12: 3.3.4
  h3: 1.15.11
  vue: 3.5.43
  vue-router: 5.4.0
  firebase: 11.10.0
  vuefire: 3.2.2
  nuxt-vuefire: ^1.1.0
