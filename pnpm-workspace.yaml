packages:
  - 'packages/core/*'
  - 'packages/extensions/*'
  - 'packages/ecosystem/*'
  - 'projects/*/*'
  - 'tools/*'

autoInstallPeers: false
confirmModulesPurge: false
engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true
verifyDepsBeforeRun: false
nodeVersion: 22.23.1

# Narrow install-script allowlist for dependencies required by the current toolchain.
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true
  vue-demi: true

patchedDependencies:
  'httpxy@0.5.2': scripts/patches/httpxy@0.5.2.patch

overrides:
  nuxt: 4.4.6
  '@nuxt/kit': 4.4.6
  '@nuxt/schema': 4.4.6
  '@nuxt/content': 3.6.3
  c12: 3.3.4
  h3: 1.15.11
  vue: 3.5.20
  firebase: 11.10.0
  vuefire: 3.2.2
  nuxt-vuefire: ^1.1.0
