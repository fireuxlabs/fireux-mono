packages:
  - 'packages/core/*'
  - 'packages/extensions/*'
  - 'packages/ecosystem/*'
  - 'packages/ecosystem/*/apps/*'
  - 'projects/*/*'
  - 'tools/*'
  - 'test-*'

autoInstallPeers: false
confirmModulesPurge: false
engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true
verifyDepsBeforeRun: false
nodeVersion: 22.23.1

onlyBuiltDependencies:
  - better-sqlite3

overrides:
  nuxt: 4.4.6
  '@nuxt/kit': 4.4.6
  '@nuxt/schema': 4.4.6
  '@nuxt/content': 3.6.3
  vue: 3.5.20
  firebase: 11.10.0
  vuefire: 3.2.2
  nuxt-vuefire: ^1.1.0
