<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sproochli Embed Test</title>
    <style>
      :root {
        color: #1d1d1f;
        background: #f5f2ea;
        font-family: Georgia, "Times New Roman", serif;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        min-height: 100svh;
        padding: clamp(1rem, 5vw, 4rem);
      }

      a {
        color: inherit;
      }

      p {
        max-width: 52rem;
        color: #5a5246;
        line-height: 1.7;
      }

      code {
        border-radius: 999px;
        background: #eee3cf;
        padding: 0.15rem 0.45rem;
      }

      iframe {
        display: block;
        width: 100%;
        max-width: 52rem;
        min-height: 560px;
        border: 0;
        border-radius: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/">Back to harness</a></p>
      <h1>Sproochli plain embed</h1>
      <p>Source: <code>https://sproochli.web.app/tools/menu</code></p>
      <iframe
        id="sproochli-tool"
        title="Sproochli menu translation tool"
        src="https://sproochli.web.app/tools/menu?title=Menu%20translation&description=Translate%20menu%20copy%20with%20the%20Sproochli%20provider.&publicMenuUrl=&publicMenuUrlLabel=Public%20menu%20URL&publicMenuUrlPlaceholder=https%3A%2F%2Fmisebox.app%2Fkitchens%2Fla-tapberne%2Fmenus%2Fmain&kitchenSlug=&kitchenSlugLabel=Kitchen&menuId=&menuIdLabel=Menu&sourceLanguage=de&sourceLanguageLabel=Source%20language&targetLanguages=en%2C%20fr%2C%20it&targetLanguagesLabel=Target%20languages&ctaLabel=Prepare%20menu%20translation"
      ></iframe>
    </main>
    <script src="/embed.js"></script>
    <script>
      connectProviderIframe({
        selector: '#sproochli-tool',
        providerOrigin: 'https://sproochli.web.app',
        messageSource: 'sproochli'
      })
    </script>
  </body>
</html>
